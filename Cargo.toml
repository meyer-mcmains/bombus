[package]
name = "bombus"
description = "A thin client for MusicBee."
version = "0.1.0"
authors = ["meyer-mcmains <meyer.mcmains@gmail.com>"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.13.1"
souvlaki = "0.8.3"
bombus-data = { path = "bombus-data" }
image = { version = "0.25.8", default-features = false, features = ["jpeg"] }
cacao = "0.3.2"
regex = "1.11.2"
itertools = "0.14.0"

[build-dependencies]
slint-build = "1.0"

[package.metadata.bundle]
name = "Bombus"
identifier = "app.meyer-mcmains.bombus"
icon = ["src/assets/icon.png"]
